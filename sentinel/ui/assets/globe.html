<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel Globe</title>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.1/dist/globe.gl.min.js"></script>
<style>
:root{--bg:#000;--panel:rgba(8,8,8,.92);--border:#1f1f1f;--border2:#333;--text:#ededed;--muted:#a3a3a3;--dim:#6e6e6e;--up:#3fcf8e;--down:#f2555a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;color:var(--text);width:100%;height:100%;overflow:hidden;font:12px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;backdrop-filter:blur(6px)}
.lbl{color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
button{font:inherit;color:inherit}

#hdr{position:absolute;top:10px;left:10px;right:10px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
#hdr .panel{pointer-events:auto;padding:6px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.18em;font-size:12px}
.stat{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:#555;display:inline-block}
.dot.on{background:var(--up)}

#layers{position:absolute;left:10px;top:56px;z-index:20;width:200px;max-height:calc(100% - 120px);overflow-y:auto;padding:8px}
#layers .grp{margin:8px 4px 4px}
#layers .grp:first-child{margin-top:2px}
.tog{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:transparent;border:0;
  border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--muted);text-align:left}
.tog:hover{background:rgba(255,255,255,.05);color:var(--text)}
.tog .sw{width:26px;height:14px;border-radius:7px;background:#262626;position:relative;flex:none;transition:background .15s}
.tog .sw::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#6e6e6e;transition:all .15s}
.tog.on{color:var(--text)}
.tog.on .sw{background:#fff}
.tog.on .sw::after{left:14px;background:#000}
.tog .cnt{color:var(--dim);font-size:10px;margin-left:auto;margin-right:6px}
#layersBtn{display:none}

#side{position:absolute;right:10px;top:56px;bottom:52px;z-index:30;width:340px;overflow-y:auto;display:none;padding:14px}
#side.show{display:block}
.x{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--dim);font-size:16px;background:none;border:0}
.x:hover{color:var(--text)}
.cn{font-size:20px;font-weight:700;margin-top:4px;padding-right:20px}
.tabs{display:flex;gap:4px;margin:12px 0 8px;border-bottom:1px solid var(--border)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 8px;color:var(--dim);cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.06em}
.tab.on{color:var(--text);border-bottom-color:#fff}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #141414}
.row span:first-child{color:var(--dim)}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.leader{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #141414}
.leader img{width:44px;height:44px;border-radius:6px;object-fit:cover;filter:grayscale(1);background:#111;flex:none}
.src{color:var(--dim);font-size:10px;margin-top:10px}

#card{position:absolute;z-index:40;width:290px;padding:12px 14px;display:none}
#card.show{display:block}
#card .t{font-size:14px;font-weight:600;margin:4px 18px 6px 0;line-height:1.35}
#card .b{color:var(--muted);line-height:1.6;white-space:pre-line;font-variant-numeric:tabular-nums}

#tt{position:absolute;z-index:45;background:#111;border:1px solid var(--border2);border-radius:6px;padding:3px 7px;font-size:11px;display:none;pointer-events:none;white-space:nowrap}

#bottom{position:absolute;left:10px;right:10px;bottom:10px;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none}
#bottom>*{pointer-events:auto}
#news{max-width:min(460px,60%);padding:8px 10px}
#news .it{display:block;color:var(--text);text-decoration:none;font-size:12px;line-height:1.4;padding:5px 0;border-top:1px solid #141414}
#news .it:first-of-type{border-top:0}
#news .it:hover{text-decoration:underline}
#news .d{color:var(--dim);font-size:10px}
#news.min .body{display:none}
.ctl{display:flex;gap:6px;align-items:center;padding:6px 8px}
.btn{background:#111;border:1px solid var(--border2);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11px;color:var(--muted)}
.btn:hover,.btn.on{background:#fff;color:#000;border-color:#fff}
#wx{display:none}
#wx.show{display:flex}
#quality{position:absolute;right:10px;bottom:52px;z-index:25;width:230px;padding:10px;display:none}
#quality.show{display:block}
#quality .btn{display:block;width:100%;text-align:left;margin:4px 0}
#quality .btn small{display:block;color:var(--dim);font-size:10px;margin-top:2px}
#quality .btn.on small{color:#444}
#knobs{display:none;margin-top:6px}
#knobs label{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--dim);font-size:10px;margin:4px 0}
#knobs input{width:110px;accent-color:#fff}
#attr{position:absolute;right:12px;bottom:52px;z-index:15;color:#555;font-size:9px;max-width:50%;text-align:right;pointer-events:auto}
#attr a{color:#777;text-decoration:none}

#ls{position:absolute;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#ls.gone{display:none}
#ls .bar{width:160px;height:2px;background:#151515;overflow:hidden;border-radius:1px}
#ls .bar::after{content:'';display:block;width:40%;height:100%;background:#fff;animation:sl 1.1s linear infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

@media (max-width:720px){
  #layers{display:none;top:56px}
  #layers.show{display:block}
  #layersBtn{display:inline-block}
  #side{left:10px;width:auto}
  #news{display:none}
}
</style>
</head>
<body>
<div id="ls"><div class="brand">SENTINEL GLOBE</div><div class="bar"></div><div class="lbl" id="lsmsg">Loading globe…</div></div>
<div id="globe" style="position:absolute;inset:0"></div>

<div id="hdr">
  <div class="panel">
    <span class="brand">GLOBE</span>
    <button class="btn" id="layersBtn" onclick="document.getElementById('layers').classList.toggle('show')">Layers</button>
    <span class="stat" id="st-snap"><span class="dot"></span>snapshot</span>
    <span class="stat" id="st-air"><span class="dot"></span>mil-air —</span>
    <span class="stat" id="st-sat"><span class="dot"></span>sats —</span>
    <span class="stat" id="st-ais"><span class="dot"></span>AIS —</span>
  </div>
  <div class="panel"><span class="stat" id="clk"></span></div>
</div>

<div id="layers" class="panel"></div>
<div id="side" class="panel"><button class="x" onclick="closeSide()" aria-label="Close">✕</button><div id="sideBody"></div></div>
<div id="card" class="panel"><button class="x" onclick="closeCard()" aria-label="Close">✕</button>
  <div class="lbl" id="cardLbl"></div><div class="t" id="cardTitle"></div><div class="b" id="cardBody"></div></div>
<div id="tt"></div>
<div id="attr"></div>

<div id="bottom">
  <div id="news" class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
    <span class="lbl">Conflict headlines · GDELT</span><button class="btn" onclick="document.getElementById('news').classList.toggle('min')">–</button></div>
    <div class="body" id="newsBody"></div></div>
  <div class="panel ctl">
    <button class="btn on" id="bmBtn" onclick="toggleBasemap()">Basemap</button>
    <button class="btn" id="rotBtn" onclick="toggleRotate()">Auto-rotate</button>
    <button class="btn" onclick="resetView()">Reset view</button>
  </div>
</div>

// Grayscale scheme; layers differ by shade, size and altitude.
const SHADE = {milair: '#FFFFFF', satellites: '#D4D4D4', vessels: '#8A8A8A', earthquakes: '#F2555A', eonet: '#BDBDBD',
               nuclear: '#FFFFFF', refineries: '#BDBDBD', ports: '#8A8A8A', cables: '#A3A3A3', pipelines: '#FFFFFF'};
const LAYERS = [
  {grp: 'Context'},
  {id: 'borders', name: 'Country borders', on: true},
  {id: 'conflicts', name: 'Conflict news (approx.)'},
  {grp: 'Tracking'},
  {id: 'milair', name: 'Military aircraft'},
  {id: 'satellites', name: 'Satellites'},
  {id: 'vessels', name: 'AIS vessels'},
  {grp: 'Hazards'},
  {id: 'earthquakes', name: 'Earthquakes M2.5+ (24h)'},
  {id: 'eonet', name: 'NASA EONET events'},
  {grp: 'Infrastructure'},
  {id: 'cables', name: 'Subsea cables'},
  {id: 'pipelines', name: 'Oil & gas pipelines'},
  {id: 'nuclear', name: 'Nuclear plants'},
  {id: 'refineries', name: 'Refineries'},
  {id: 'ports', name: 'Major ports'},
];
const ON = new Set(['borders']);
const CACHE = {};   // layer → array of point/path objects (built once)
let globe, countries = [], hoverPoly = null, basemap = true;

function buildLayerPanel() {
  $('layers').innerHTML = LAYERS.map(l => l.grp
    ? `<div class="lbl grp">${esc(l.grp)}</div>`
    : `<button class="tog${ON.has(l.id) ? ' on' : ''}" data-layer="${l.id}" onclick="toggleLayer('${l.id}')">
         <span>${esc(l.name)}</span><span class="cnt" id="cnt-${l.id}"></span><span class="sw"></span></button>`).join('');
}
function setStat(id, text, ok) { const el = $(id); if (el) el.innerHTML = `<span class="dot${ok ? ' on' : ''}"></span>${esc(text)}`; }
function setCount(layer, n) { const el = $('cnt-' + layer); if (el) el.textContent = n ? n.toLocaleString() : ''; }

async function fetchJSON(url, ms = 12000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, {signal: ctl.signal}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

// ── Layer builders → normalized points {lat,lng,alt,r,color,info} / paths {pts,color,info}
const pt = (layer, lat, lng, info, o = {}) => ({layer, lat, lng, alt: o.alt ?? 0.005, r: o.r ?? 0.25, color: o.color || SHADE[layer], info});
const BUILD = {
  milair: () => (DATA.planes || []).filter(a => isFinite(a.lat) && isFinite(a.lon)).map(a => {
    const ground = a.on_ground === true, ft = Number(a.alt_baro) || 0;
    return pt('milair', a.lat, a.lon, {cat: 'Military aircraft · adsb.lol', title: String(a.flight || a.hex || 'Unknown').trim(),
      body: `Altitude  ${ground ? 'on ground' : Math.round(ft).toLocaleString() + ' ft'}\nSpeed  ${Math.round(a.gs || 0)} kt\n` +
            `Track  ${Math.round(a.track || 0)}°\nType  ${a.aircraft_type || '—'}\nRegistration  ${a.registration || '—'}\nICAO hex  ${a.hex || '—'}`},
      {alt: ground ? 0.004 : 0.02 + Math.min(ft, 50000) / 50000 * 0.04, r: 0.22});
  }),
  satellites: () => (DATA.sats || []).filter(s => isFinite(s.lat) && isFinite(s.lon)).map(s =>
    pt('satellites', s.lat, s.lon, {cat: 'Satellite · CelesTrak TLE', title: String(s.name || 'Satellite').slice(0, 80),
      body: `Altitude  ${Math.round(s.alt_km || 0).toLocaleString()} km\nSpeed  ${(s.vel_kms || 0).toFixed(2)} km/s\nPosition at snapshot time`},
      {alt: Math.min((s.alt_km || 400) / 6371, 0.6), r: 0.18})),
  vessels: () => (DATA.vessels || []).filter(v => isFinite(v.lat) && isFinite(v.lon)).map(v =>
    pt('vessels', v.lat, v.lon, {cat: 'AIS vessel', title: v.name || 'Vessel',
      body: `MMSI  ${v.mmsi || '—'}\nSpeed  ${(v.speed || 0).toFixed(1)} kt\nCourse  ${Math.round(v.heading || 0)}°`}, {r: 0.12, alt: 0.003})),
  nuclear: () => NUCLEAR_PLANTS.map(([n, c, lat, lng, mw, re, st]) => pt('nuclear', lat, lng,
    {cat: `Nuclear plant · ${c}`, title: n, body: `Capacity  ${mw.toLocaleString()} MW\nReactors  ${re}\nStatus  ${st}`},
    {r: 0.35, color: st === 'Active' ? '#FFFFFF' : '#6E6E6E'})),
  refineries: () => OIL_REFINERIES.map(([n, c, lat, lng, bpd, op]) => pt('refineries', lat, lng,
    {cat: `Refinery · ${c}`, title: n, body: `Capacity  ${(bpd / 1000).toFixed(0)}k bbl/day\nOperator  ${op}`}, {r: 0.3})),
  ports: () => MAJOR_PORTS.map(([n, c, lat, lng, teu, type]) => pt('ports', lat, lng,
    {cat: `${type} · ${c}`, title: n, body: teu ? `Throughput  ${(teu / 1e6).toFixed(1)}M TEU / year` : type}, {r: 0.3})),
  earthquakes: async () => {
    const d = await fetchJSON('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
    return (d.features || []).map(f => {
      const [lng, lat, depth] = (f.geometry && f.geometry.coordinates) || [];
      const p = f.properties || {}, mag = Number(p.mag || 0);
      if (!isFinite(lat) || !isFinite(lng)) return null;
      return pt('earthquakes', lat, lng, {cat: 'Earthquake · USGS', title: `M${mag.toFixed(1)} — ${p.place || 'Unknown'}`,
        body: `Depth  ${Number(depth || 0).toFixed(0)} km\nTime  ${p.time ? new Date(p.time).toISOString().replace('T', ' ').slice(0, 16) + ' UTC' : '—'}` +
              (p.tsunami ? '\nTsunami flag  yes' : ''), url: p.url},
        {r: Math.max(0.15, mag * 0.12), alt: 0.002 + Math.max(0, mag - 2.5) * 0.006, color: depth < 70 ? '#F2555A' : '#A3A3A3'});
    }).filter(Boolean);
  },
  eonet: async () => {
    const d = await fetchJSON('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=80');
    return (d.events || []).map(ev => {
      const g = (ev.geometry || []).slice(-1)[0] || {};
      let c = g.coordinates;
      if (g.type === 'Polygon' && Array.isArray(c) && c[0]) c = c[0][0];
      if (!Array.isArray(c) || !isFinite(c[0]) || !isFinite(c[1])) return null;
      const cat = (ev.categories && ev.categories[0]) || {};
      return pt('eonet', c[1], c[0], {cat: `${cat.title || 'Event'} · NASA EONET`, title: ev.title,
        body: `Latest observation  ${(g.date || '').slice(0, 10)}`, url: ev.link}, {r: 0.3});
    }).filter(Boolean);
  },
};
const PATHS = {
  cables: () => SUBMARINE_CABLES.map(([n, tbps, km, own, pts]) => ({layer: 'cables', pts: pts.map(([lo, la]) => [la, lo]),
    color: SHADE.cables, info: {cat: 'Subsea cable (route approximate)', title: n,
    body: `Capacity  ${tbps} Tbps\nLength  ${km.toLocaleString()} km\nOwners  ${own}`}})),
  pipelines: () => OIL_PIPELINES.map(([n, type, cap, route, pts]) => ({layer: 'pipelines', pts: pts.map(([lo, la]) => [la, lo]),
    color: type === 'Oil' ? '#FFFFFF' : '#8A8A8A', info: {cat: `${type} pipeline (route approximate)`, title: n,
    body: `Route  ${route}\nCapacity  ${cap ? cap + (type === 'Oil' ? ' M bbl/day' : '') : 'offline / not built'}`}})),
};

async function ensure(id) {
  if (CACHE[id]) return CACHE[id];
  const fn = BUILD[id] || PATHS[id];
  CACHE[id] = fn ? await fn() : [];
  setCount(id, CACHE[id].length);
  return CACHE[id];
}

function refresh() {
  const pts = [], paths = [];
  for (const id of ON) {
    if (!CACHE[id]) continue;
    (PATHS[id] ? paths : pts).push(...CACHE[id]);
  }
  globe.pointsData(pts).pathsData(paths);
  globe.polygonsData(ON.has('borders') ? countries : []);
  const conf = ON.has('conflicts') ? (DATA.conflicts || []) : [];
  globe.ringsData(conf).labelsData(conf);
}

async function toggleLayer(id) {
  const btn = document.querySelector(`.tog[data-layer="${id}"]`);
  const on = !ON.has(id);
  btn.classList.toggle('on', on);
  if (on) ON.add(id); else ON.delete(id);
  if (on && id !== 'borders' && id !== 'conflicts') {
    try { await ensure(id); } catch (e) { console.warn(id, e); btn.classList.remove('on'); ON.delete(id); setCount(id, 0); }
  }
  if (id === 'conflicts') setCount('conflicts', (DATA.conflicts || []).length);
  refresh();
}

// ── Cards / tooltip
function showCard(info, ev) {
  $('cardLbl').textContent = info.cat || '';
  $('cardTitle').textContent = info.title || '';
  $('cardBody').textContent = info.body || '';
  if (info.url && safeUrl(info.url) !== '#') {
    const a = document.createElement('a'); a.href = safeUrl(info.url); a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = 'Source ↗'; a.style.cssText = 'display:block;margin-top:8px;color:#a3a3a3;text-decoration:none';
    $('cardBody').appendChild(a);
  }
  const card = $('card'); card.classList.add('show');
  const x = ev ? ev.clientX : window.innerWidth / 2, y = ev ? ev.clientY : window.innerHeight / 2;
  card.style.left = Math.max(10, Math.min(x + 16, window.innerWidth - card.offsetWidth - 10)) + 'px';
  card.style.top = Math.max(56, Math.min(y - 10, window.innerHeight - card.offsetHeight - 60)) + 'px';
}
function closeCard() { $('card').classList.remove('show'); }
function closeSide() { $('side').classList.remove('show'); }
let mouse = {x: 0, y: 0};
document.addEventListener('mousemove', e => { mouse = {x: e.clientX, y: e.clientY}; const tt = $('tt');
  if (tt.style.display === 'block') { tt.style.left = (e.clientX + 14) + 'px'; tt.style.top = (e.clientY - 8) + 'px'; } });
function hover(label) {
  const tt = $('tt');
  if (label) { tt.textContent = label; tt.style.display = 'block'; tt.style.left = (mouse.x + 14) + 'px'; tt.style.top = (mouse.y - 8) + 'px'; }
  else tt.style.display = 'none';
  $('globe').style.cursor = label ? 'pointer' : 'grab';
}

// ── Country profile (REST Countries · World Bank · Wikidata)
const fmtUsd = v => v >= 1e12 ? '$' + (v / 1e12).toFixed(2) + 'T' : v >= 1e9 ? '$' + (v / 1e9).toFixed(1) + 'B' : '$' + (v / 1e6).toFixed(0) + 'M';
async function wbLatest(iso3, ind) {
  const y = new Date().getUTCFullYear();
  const d = await fetchJSON(`https://api.worldbank.org/v2/country/${iso3}/indicator/${ind}?format=json&date=${y - 6}:${y}&per_page=10`, 10000);
  const row = (d[1] || []).find(r => r && r.value != null);
  return row ? {v: row.value, y: row.date} : null;
}
async function sparql(q) {
  const d = await fetchJSON('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q), 12000);
  return (d.results && d.results.bindings) || [];
}
const v = (b, k) => (b[k] ? b[k].value : '');
// Country facts + current heads of state/government (Wikidata, keyless, CORS-enabled).
async function wikidataCountry(iso2) {
  const facts = await sparql(`SELECT
      (GROUP_CONCAT(DISTINCT ?capL; separator=", ") AS ?capital)
      (GROUP_CONCAT(DISTINCT ?curL; separator=", ") AS ?currency)
      (GROUP_CONCAT(DISTINCT ?langL; separator=", ") AS ?languages)
      (SAMPLE(?area) AS ?area) (SAMPLE(?flag) AS ?flag) (SAMPLE(?contL) AS ?continent)
    WHERE { ?c wdt:P297 "${iso2}" .
      OPTIONAL { ?c wdt:P36 ?cap . ?cap rdfs:label ?capL FILTER(lang(?capL)="en") }
      OPTIONAL { ?c wdt:P38 ?cur . ?cur rdfs:label ?curL FILTER(lang(?curL)="en") }
      OPTIONAL { ?c wdt:P37 ?lang . ?lang rdfs:label ?langL FILTER(lang(?langL)="en") }
      OPTIONAL { ?c wdt:P2046 ?area } OPTIONAL { ?c wdt:P41 ?flag }
      OPTIONAL { ?c wdt:P30 ?cont . ?cont rdfs:label ?contL FILTER(lang(?contL)="en") } }`);
  // Truthy wdt: values are the current (preferred-rank) office holders. Fall back to the English
  // Wikipedia title when an item has no English label.
  const heads = await sparql(`SELECT ?hsLabel ?hsWiki ?hsImg ?hgLabel ?hgWiki ?hgImg WHERE { ?c wdt:P297 "${iso2}" .
      OPTIONAL { ?c wdt:P35 ?hs . OPTIONAL { ?hs wdt:P18 ?hsImg }
        OPTIONAL { ?a1 schema:about ?hs ; schema:isPartOf <https://en.wikipedia.org/> ; schema:name ?hsWiki } }
      OPTIONAL { ?c wdt:P6 ?hg . OPTIONAL { ?hg wdt:P18 ?hgImg }
        OPTIONAL { ?a2 schema:about ?hg ; schema:isPartOf <https://en.wikipedia.org/> ; schema:name ?hgWiki } }
      SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } } LIMIT 6`);
  const seen = new Set(), leaders = [];
  const nameOf = (b, k) => { const l = v(b, k + 'Label'); return /^Q\d+$/.test(l) || !l ? v(b, k + 'Wiki') : l; };
  for (const b of heads) {
    for (const [k, role] of [['hs', 'Head of state'], ['hg', 'Head of government']]) {
      const name = nameOf(b, k);
      if (!name || seen.has(role + name)) continue;
      seen.add(role + name);
      const img = v(b, k + 'Img');
      leaders.push({role, name, img: img ? img.replace('http://', 'https://') + '?width=120' : ''});
    }
  }
  return {facts: facts[0] || {}, leaders};
}
let countryReq = 0;
async function showCountry(p) {
  const name = p.ADMIN || p.NAME;
  // Natural Earth uses ISO_A3 = "-99" for France and Norway; fall back to the _EH / ADM0 codes.
  const iso3 = [p.ISO_A3, p.ISO_A3_EH, p.ADM0_A3].find(x => x && x !== '-99');
  const iso2 = [p.ISO_A2, p.ISO_A2_EH].find(x => x && x !== '-99');
  const req = ++countryReq;
  closeCard();
  $('side').classList.add('show');
  $('sideBody').innerHTML = `<div class="lbl">${esc(iso3 || '')}</div><div class="cn">${esc(name)}</div><div class="src">Loading…</div>`;
  if (!iso3) return;
  const [wd, gdp, pop, infl] = await Promise.all([
    iso2 ? wikidataCountry(iso2).catch(() => ({facts: {}, leaders: []})) : Promise.resolve({facts: {}, leaders: []}),
    wbLatest(iso3, 'NY.GDP.MKTP.CD').catch(() => null), wbLatest(iso3, 'SP.POP.TOTL').catch(() => null),
    wbLatest(iso3, 'FP.CPI.TOTL.ZG').catch(() => null),
  ]);
  if (req !== countryReq) return;
  const f = wd.facts, leaders = wd.leaders;
  const row = (k, val) => `<div class="row"><span>${esc(k)}</span><span>${esc(val || '—')}</span></div>`;
  const area = Number(v(f, 'area'));
  const overview = [row('Capital', v(f, 'capital')), row('Continent', v(f, 'continent') || p.CONTINENT),
    row('Sub-region', p.SUBREGION), row('Area', area ? Math.round(area).toLocaleString() + ' km²' : ''),
    row('Currency', v(f, 'currency')), row('Official languages', v(f, 'languages').split(', ').slice(0, 3).join(', ')),
  ].join('') + '<div class="src">Wikidata · Natural Earth</div>';
  const economy = [row(`GDP${gdp ? ' (' + gdp.y + ')' : ''}`, gdp ? fmtUsd(gdp.v) : ''),
    row(`Population${pop ? ' (' + pop.y + ')' : ''}`, pop ? (pop.v / 1e6).toFixed(1) + ' M' : ''),
    row('GDP per capita', gdp && pop ? '$' + Math.round(gdp.v / pop.v).toLocaleString() : ''),
    row(`Inflation${infl ? ' (' + infl.y + ')' : ''}`, infl ? infl.v.toFixed(1) + '%' : ''),
  ].join('') + '<div class="src">World Bank (latest available year)</div>';
  const people = leaders.length ? leaders.map(l => `<div class="leader">${l.img ? `<img src="${esc(safeUrl(l.img))}" alt="" loading="lazy">` : '<img alt="">'}
      <div><div>${esc(l.name)}</div><div class="lbl" style="margin-top:2px">${esc(l.role)}</div></div></div>`).join('') + '<div class="src">Wikidata (current office holders)</div>'
    : '<div class="src">No current office holders found on Wikidata.</div>';
  const flagUrl = v(f, 'flag') ? v(f, 'flag').replace('http://', 'https://') + '?width=80' : '';
  const flag = flagUrl ? `<img src="${esc(safeUrl(flagUrl))}" alt="" style="height:16px;margin-top:6px;filter:grayscale(1);border:1px solid #222">` : '';
  $('sideBody').innerHTML = `<div class="lbl">${esc(iso3)}</div><div class="cn">${esc(name)}</div>${flag}
    <div class="tabs"><button class="tab on" data-t="o">Overview</button><button class="tab" data-t="e">Economy</button><button class="tab" data-t="l">Leaders</button></div>
    <div id="tab-o">${overview}</div><div id="tab-e" style="display:none">${economy}</div><div id="tab-l" style="display:none">${people}</div>`;
  $('sideBody').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    $('sideBody').querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
    ['o', 'e', 'l'].forEach(t => { $('tab-' + t).style.display = t === b.dataset.t ? 'block' : 'none'; });
  });
}

// ── Controls
// Esri Dark Gray Canvas: keyless (CARTO now requires an API key).
const tileUrl = (x, y, l) => `https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/${l}/${y}/${x}`;
const ATTR = 'Basemap © <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a>, HERE, Garmin, © OpenStreetMap contributors';
function toggleBasemap() {
  basemap = !basemap; $('bmBtn').classList.toggle('on', basemap);
  globe.globeTileEngineUrl(basemap ? tileUrl : null);
  $('attr').innerHTML = basemap ? ATTR : '';
}
function toggleRotate() {
  const c = globe.controls(); c.autoRotate = !c.autoRotate; c.autoRotateSpeed = 0.35; $('rotBtn').classList.toggle('on', c.autoRotate);
}
function resetView() { globe.pointOfView({lat: 22, lng: 25, altitude: 2.4}, 900); }

function renderNews() {
  const items = DATA.headlines || [];
  $('newsBody').innerHTML = items.length ? items.slice(0, 4).map(a => `<a class="it" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">
      ${esc(String(a.title).slice(0, 120))}<div class="d">${esc(a.domain || '')}</div></a>`).join('')
    : '<div class="d">No headlines available (GDELT rate limit).</div>';
}

function init() {
  if (typeof Globe === 'undefined') { $('lsmsg').textContent = 'Could not load the globe library from the CDN.'; return; }
  const el = $('globe');
  globe = Globe({rendererConfig: {antialias: true, powerPreference: 'high-performance'}})(el)
    .backgroundColor('#000000')
    .showAtmosphere(true).atmosphereColor('#9a9a9a').atmosphereAltitude(0.12)
    .globeTileEngineUrl(tileUrl)
    // Countries
    .polygonCapColor(d => d === hoverPoly ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.015)')
    .polygonSideColor(() => 'rgba(0,0,0,0)').polygonStrokeColor(() => 'rgba(255,255,255,0.35)')
    .polygonAltitude(d => d === hoverPoly ? 0.008 : 0.004).polygonsTransitionDuration(150)
    .onPolygonHover(d => { hoverPoly = d; globe.polygonCapColor(globe.polygonCapColor()); hover(d && (d.properties.ADMIN || d.properties.NAME)); })
    .onPolygonClick(d => showCountry(d.properties))
    // Points
    .pointLat('lat').pointLng('lng').pointAltitude('alt').pointRadius('r').pointColor('color').pointResolution(6)
    .pointsMerge(false).pointsTransitionDuration(0)
    .onPointHover(d => hover(d && d.info.title)).onPointClick((d, ev) => showCard(d.info, ev))
    // Paths
    .pathPoints('pts').pathColor('color').pathStroke(1.2).pathTransitionDuration(0)
    .onPathHover(d => hover(d && d.info.title)).onPathClick((d, ev) => showCard(d.info, ev))
    // Conflict news signals
    .ringLat('lat').ringLng('lon').ringColor(() => t => `rgba(242,85,90,${1 - t})`).ringMaxRadius(3.5)
    .ringPropagationSpeed(1.6).ringRepeatPeriod(1400)
    .labelLat('lat').labelLng('lon').labelText('label').labelSize(0.55).labelDotRadius(0.35).labelColor(() => '#F2555A')
    .labelResolution(2).labelAltitude(0.01)
    .onLabelClick((d, ev) => showCard({cat: 'News signal · GDELT 48h (regional centroid, not an event location)', title: d.label,
       body: (d.titles || []).map(t => '• ' + t).join('\n'), url: d.url}, ev))
    .onGlobeClick(() => { closeCard(); });
  globe.controls().enableDamping = true;
  globe.controls().minDistance = 120;
  globe.controls().maxDistance = 900;
  const fit = () => globe.width(el.clientWidth).height(el.clientHeight);
  new ResizeObserver(fit).observe(el); fit();
  resetView();
  $('attr').innerHTML = ATTR;

  fetchJSON('https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.1.2/geojson/ne_110m_admin_0_countries.geojson', 20000)
    .then(g => { countries = (g.features || []).filter(f => f.properties.ISO_A3 !== 'ATA'); refresh(); })
    .catch(e => console.warn('borders', e));

  const c = (DATA.meta && DATA.meta.counts) || {};
  setStat('st-air', `mil-air ${c.planes ?? 0}`, (c.planes || 0) > 0);
  setStat('st-sat', `sats ${c.sats ?? 0}`, (c.sats || 0) > 0);
  setStat('st-ais', `AIS ${c.vessels ?? 0}`, (c.vessels || 0) > 0);
  const age = () => {
    const t = DATA.meta && DATA.meta.generatedAt ? new Date(DATA.meta.generatedAt) : null;
    if (!t || isNaN(t)) return;
    const m = Math.max(0, Math.round((Date.now() - t) / 60000));
    setStat('st-snap', m < 1 ? 'snapshot now' : `snapshot ${m}m ago`, m < 10);
  };
  age(); setInterval(age, 30000);
  setInterval(() => { $('clk').textContent = new Date().toISOString().slice(11, 19) + ' UTC'; }, 1000);
  buildLayerPanel();
  renderNews();
  $('ls').classList.add('gone');
}

Object.assign(window, {toggleLayer, resetView, closeSide, closeCard, toggleBasemap, toggleRotate});
(function boot() {
  const el = $('globe');
  if (!el.clientWidth || !el.clientHeight) return setTimeout(boot, 60);
  try { init(); } catch (e) { console.error(e); $('lsmsg').textContent = 'Globe failed to start: ' + e.message; }
})();
setTimeout(() => $('ls').classList.add('gone'), 15000);
</script>
</body>
</html>
